name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V | tail -1
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Run macOS unit tests
        run: Tools/build.sh test

  ios-tests:
    name: iOS Simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: Run iOS Simulator unit tests
        run: Tools/build.sh test ios

      - name: Run iPad Simulator unit tests
        run: Tools/build.sh test ipados

  i18n:
    name: Localization gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check complete languages are fully translated
        run: |
          python3 Tools/i18n.py coverage
          python3 Tools/i18n.py check
